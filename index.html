<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交通网络安全韧性评估及可视化决策平台</title>
    <link href="http://127.0.0.1:9000/bigemap.js/v2.1.0/bigemap.css" rel="stylesheet" />
    <script src="http://127.0.0.1:9000/bigemap.js/v2.1.0/bigemap.js"></script>
    <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
    <div id="app">
        <!-- ===== Map ===== -->
        <div id="map-container">
            <div id="map"></div>
        </div>
        <div id="admin-division-layer" class="admin-division-layer"></div>

        <!-- ===== Header ===== -->
        <header id="header">
            <div class="header-left">
                <div class="header-left-row" style="display:flex;align-items:center;gap:8px;">
                    <span class="header-time" id="header-time">--:--:--</span>
                </div>
                <div class="header-left-row">
                    <span class="header-weather">
                        🌧️ <span id="header-weather-text">小雨 22℃ 东北风3级</span>
                    </span>
                </div>
            </div>

            <div class="header-title">
                <span>交通网络安全韧性评估及可视化决策平台</span>
            </div>

            <div class="header-right">
                <span class="data-source-badge" id="data-source-badge">📡 检测中...</span>

                <button class="header-location">
                    📍 重庆市 ▼
                </button>

                <div class="header-user" id="header-user">
                    <span class="user-avatar">👤</span>
                    <span class="user-name">管理员</span>
                    <span class="user-arrow">▼</span>

                    <div class="user-dropdown" id="user-dropdown">
                        <div class="dropdown-item">👤 个人中心</div>
                        <div class="dropdown-item">🔑 修改密码</div>
                        <div class="dropdown-item">🔄 切换用户</div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item" style="color:var(--accent-red);">🚪 安全退出</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== Search Bar ===== -->
        <div id="search-bar">
            <input type="text" id="search-input" placeholder="搜索桥梁名称/道路编码..." />
            <button id="search-btn">🔍 定位</button>
        </div>

        <!-- ===== Layer Drawer ===== -->
        <div id="layer-drawer" class="glass-panel">
            <div class="layer-drawer-title">🗺️ 图层控制</div>
            <!-- 底图组：互斥单选 -->
            <div style="font-size:10px;color:var(--text-muted);padding:4px 0 2px;font-weight:600;">底图</div>
            <div class="layer-item" data-layer="base"><span class="layer-toggle"></span><span
                    class="layer-dot base"></span><span>暗色底图</span></div>
            <div class="layer-item" data-layer="satellite"><span class="layer-toggle"></span><span
                    class="layer-dot base"></span><span>卫星影像</span></div>
            <div class="layer-item" data-layer="bigemap-electronic"><span class="layer-toggle"></span><span
                    class="layer-dot base"></span><span>电子地图（Bigemap）</span></div>
            <div class="layer-item" data-layer="bigemap-satellite"><span class="layer-toggle"></span><span
                    class="layer-dot base"></span><span>卫星地图（Bigemap）</span></div>

            <div class="layer-divider"></div>
            <!-- 业务图层：独立多选 -->
            <div style="font-size:10px;color:var(--text-muted);padding:4px 0 2px;font-weight:600;">业务图层</div>
            <div class="layer-item" data-layer="admin-division"><span class="layer-toggle active"></span><span
                    class="layer-dot admin"></span><span>行政区划</span></div>
            <div class="layer-item" data-layer="road"><span class="layer-toggle active"></span><span
                    class="layer-dot road"></span><span>高速/快速路网</span></div>
            <div class="layer-item" data-layer="bridge"><span class="layer-toggle active"></span><span
                    class="layer-dot bridge"></span><span>显示桥梁隧道</span></div>
        </div>

        <!-- ===== Map Controls ===== -->
        <div id="map-controls">
            <button class="map-ctrl-btn" id="btn-zoom-in" title="放大">＋</button>
            <button class="map-ctrl-btn" id="btn-zoom-out" title="缩小">−</button>
            <div class="map-ctrl-divider"></div>
            <button class="map-ctrl-btn" id="btn-layer-control" title="图层控制中枢">🗺️</button>
        </div>

        <!-- ===== LEFT TWIN DOCK ===== -->
        <!-- ===== LEFT TWIN DOCK ===== -->
        <div class="twin-dock left-twin-dock">
            <!-- 块1: 区域总览（2×2核心指标） -->
            <div class="sub-block-card" id="left-block-1">
                <div class="block-header">
                    <span>区域总览</span>
                    <span style="font-size:13px;color:var(--text-muted);font-weight:400;">重庆市</span>
                </div>
                <div class="asset-grid" id="asset-grid"></div>
            </div>
            <!-- 块2: 区域风险概况（ECharts柱状图） -->
            <div class="sub-block-card" id="left-block-2">
                <div class="block-header">区域风险概况</div>
                <div id="risk-overview-chart" style="width:100%;flex:1;min-height:0;"></div>
            </div>
            <!-- 块3: 重车通行概况（双环形图） -->
            <div class="sub-block-card scrollable-card" id="left-block-3">
                <div class="block-header sticky-header">重车通行概况</div>
                <div id="truck-overview" style="display:flex;gap:8px;padding:4px;flex:1;min-height:0;"></div>
            </div>
        </div>

        <!-- ===== RIGHT TWIN DOCK ===== -->
        <div class="twin-dock right-twin-dock">
            <!-- 块1: 核心功能模块（2×2按钮） -->
            <div class="sub-block-card" id="right-block-1">
                <div class="block-header">核心功能模块</div>
                <div id="module-buttons"></div>
            </div>
            <!-- 块2: 区域灾害韧性概况（表格） -->
            <div class="sub-block-card scrollable-card" id="right-block-2">
                <div class="block-header sticky-header">区域灾害韧性概况</div>
                <div class="scrollable-list" id="county-resilience-list"></div>
            </div>
            <!-- 块3: 桥隧状态监控（选中Asset详情） -->
            <div class="sub-block-card" id="right-block-3">
                <div class="block-header">桥隧状态监控</div>
                <div id="asset-monitor-panel" style="padding:8px;">
                    <div style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px;">
                        请在地图中选择桥梁或隧道
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Modal / Bridge / Toast ===== -->
        <div id="modal-container"></div>
        <div id="bridge-detail-container"></div>
        <div id="toast-container" class="toast-container"></div>

        <!-- ===== 底部任务日志折叠Panel ===== -->
        <div id="bottom-task-panel" class="glass-panel">
            <div id="task-panel-header" class="alert-table-header" style="cursor:pointer;">
                <span class="alert-table-title">📋 平台任务与评估日志</span>
                <span id="task-panel-toggle" style="font-size:16px;color:var(--text-muted);">▲</span>
            </div>
            <div id="task-panel-content" style="display:block;overflow:hidden;">
                <div class="tabs" style="padding:8px 12px 0;flex-shrink:0;">
                    <button class="tab-btn active" data-task-tab="heavy-vehicle">🚛 重车桥隧评估</button>
                    <button class="tab-btn" data-task-tab="disaster">🌊 灾害风险评估</button>
                    <button class="tab-btn" data-task-tab="resilience">🛡️ 路网韧性评估</button>
                    <button class="tab-btn" data-task-tab="route">🛤️ 保通路径规划</button>
                </div>
                <div style="padding:12px;min-height:80px;">
                    <div id="task-list-content" style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px;">
                        暂无任务
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
